services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: publishing
      POSTGRES_USER: publishing
      POSTGRES_PASSWORD: publishing
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - publishing-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publishing -d publishing"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  publishing-data:
