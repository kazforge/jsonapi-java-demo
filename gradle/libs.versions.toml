[versions]

jsonapi = "0.5.1"
jsonapi-spring = "0.7.0"
spring-boot = "4.1.3"
spring = "7.0.11"
jackson = "3.3.0"
junit = "6.1.3"
spotless = "8.10.4"
# 1.37.0 changes the Style API used by Spotless 8.10.4.
google-java-format = "1.36.1"
ktlint = "1.8.0"

[libraries]
jsonapi-jackson3 = { module = "com.kazforge:jsonapi-java-jackson3", version.ref = "jsonapi" }
jsonapi-spring-webmvc = { module = "com.kazforge:jsonapi-java-spring-webmvc", version.ref = "jsonapi-spring" }
jsonapi-spring-boot-starter = { module = "com.kazforge:jsonapi-java-spring-boot-starter", version.ref = "jsonapi-spring" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
spring-bom = { module = "org.springframework:spring-framework-bom", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test" }
hamcrest = { module = "org.hamcrest:hamcrest", version = "3.0" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
