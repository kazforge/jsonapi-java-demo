[versions]

jsonapi = "0.4.0"
jsonapi-spring = "0.1.0"
spring = "7.0.9"
jackson = "3.2.4"
junit = "6.1.3"
spotless = "8.10.4"
# 1.37.0 changes the Style API used by Spotless 8.10.4.
google-java-format = "1.36.1"
ktlint = "1.8.0"

[libraries]
jsonapi-jackson3 = { module = "com.kazforge:jsonapi-java-jackson3", version.ref = "jsonapi" }
jsonapi-spring-webmvc = { module = "com.kazforge:jsonapi-java-spring-webmvc", version.ref = "jsonapi-spring" }
spring-bom = { module = "org.springframework:spring-framework-bom", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test" }
hamcrest = { module = "org.hamcrest:hamcrest", version = "3.0" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
